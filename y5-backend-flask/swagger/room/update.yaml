---
tags:
  - Room
parameters:
  - name: id
    in: path
    type: string
    required: true
    description: update room with room id
  - name: body
    in: body
    required: true
    schema:
      id: room_update
      properties:
        room_name:
          type: string
          description: room name
        room_type:
          type: string
          description: room type
        people_limit:
          type: string
          description: people limit
        room_desc:
          type: string
          description: room desc
        activated:
          type: integer
          description: is activated, 0 or 1
        send_activation_mail:
          type: boolean
          default: false
          description: send activation mail to room members after this update
        publish_time:
          type: integer
          description: publish clock, 0 ~ 23
responses:
  200:
    description: return room with details
    schema:
      id: Response
      properties:
        result_code:
          type: string
        result_msg:
          type: string
        data:
          type: string
